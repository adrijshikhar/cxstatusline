name: Release & Publish
on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please (PR & Tag)
    runs-on: ubuntu-latest
    if: github.repository == 'adrijshikhar/cxstatusline' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-npm:
    name: Build & Publish to npm
    runs-on: macos-15
    needs: release-please
    if: |
      always() &&
      github.repository == 'adrijshikhar/cxstatusline' &&
      (needs.release-please.outputs.releases_created == 'true' || startsWith(github.ref, 'refs/tags/v'))
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Determine Target Git Ref
        id: target
        run: |
          if [ -n "${{ needs.release-please.outputs.tag_name }}" ]; then
            echo "ref=${{ needs.release-please.outputs.tag_name }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ needs.release-please.outputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun test
      - run: CXSTATUSLINE_RELEASE_BUILD=1 bun run build
      - run: bun run check:package
      - run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
      - run: cd "$RUNNER_TEMP" && shasum -a 256 cxstatusline-*.tgz > SHA256SUMS

      - name: Attach tarball to GitHub Release
        env:
          TAG: ${{ steps.target.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || gh release create "$TAG" --repo "$REPO" --title "cxstatusline $TAG" --notes "Source release; the packed CLI and its checksum are attached." --verify-tag
          gh release upload "$TAG" --repo "$REPO" "$RUNNER_TEMP"/cxstatusline-*.tgz "$RUNNER_TEMP"/SHA256SUMS --clobber

      - name: Publish to npm (OIDC Trusted Publishing)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "$RUNNER_TEMP"/cxstatusline-*.tgz --provenance --access public
