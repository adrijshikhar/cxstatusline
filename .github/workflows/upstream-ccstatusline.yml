name: CCStatusline Upstream Parity Watcher

on:
  schedule:
    # Check upstream ccstatusline daily at 04:30 UTC
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (check without opening issue)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-ccstatusline
  cancel-in-progress: false

jobs:
  watch:
    name: Check ccstatusline Parity
    runs-on: ubuntu-latest
    if: github.repository == 'adrijshikhar/cxstatusline'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"

      - name: Run CCStatusline Watcher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=()
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          bun run scripts/upstream-ccstatusline.ts "${ARGS[@]}"
