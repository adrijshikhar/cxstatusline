name: Prebuilt release

# Apple-Silicon-only private prebuilt release pipeline.
#
# detect -> validate -> native(arm64) -> publish -> report(always).
#
# Scheduled runs build the highest stable owner-published `v<CX>` **source release**, pinned to the
# commit that tag points at, and publish. Manual dispatch builds the dispatched commit and
# publishes only with `publish=true`. `contents: write` is granted to the `publish` job alone and
# `issues: write` to the `report` job alone; everything else is read-only.

on:
  schedule:
    # Nothing happens on a schedule until an owner-published `v<CX>` source release exists.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      codex_version:
        description: Codex version to build (auto = highest stable upstream release that this repo patches)
        type: choice
        options: ["auto", "0.155.0", "0.154.0", "0.153.4", "0.153.0", "0.152.1"]
        default: "auto"
      platforms:
        description: Target platforms to build (arm64,x64 or arm64)
        type: choice
        options: ["arm64,x64", "arm64"]
        default: "arm64,x64"
      self_hosted:
        description: Run on the owner's self-hosted Apple Silicon runner (arm64 only; no hosted minutes)
        type: boolean
        default: false
      publish:
        description: Publish the verified artifact as a GitHub release (consumed by the publish job)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: prebuilt-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  CARGO_BUILD_JOBS: "3"
  CARGO_PROFILE_RELEASE_DEBUG: "0"

jobs:
  # Resolves every release input once, so no later job re-derives the version or the tag.
  detect:
    # Repository-identity guard: keeps forks from running a release pipeline against their
    # own repository. Guarding `detect` also stops `validate`/`native`, which need it.
    if: github.repository == 'adrijshikhar/cxstatusline'
    runs-on: ${{ inputs.self_hosted && fromJSON('["self-hosted","macOS","ARM64","m5-pro"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    outputs:
      codex_version: ${{ steps.detect.outputs.codex_version }}
      cx_version: ${{ steps.detect.outputs.cx_version }}
      tag: ${{ steps.detect.outputs.tag }}
      upstream_tag: ${{ steps.detect.outputs.upstream_tag }}
      patch_file: ${{ steps.detect.outputs.patch_file }}
      patch_sha256: ${{ steps.detect.outputs.patch_sha256 }}
      source_commit: ${{ steps.detect.outputs.source_commit }}
      release_state: ${{ steps.detect.outputs.release_state }}
      should_build: ${{ steps.detect.outputs.should_build }}
      blocked_reason: ${{ steps.detect.outputs.blocked_reason }}
      platforms: ${{ steps.detect.outputs.platforms }}
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      # Full history: a scheduled run resolves an older `v<CX>` source commit and must read
      # `patches/manifest.json` and the patch bytes out of *that* commit, not out of this
      # checkout's default branch. Shallow history would not contain it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      # Exit 3 is "blocked, not broken": upstream moved past every supported patch, or the tag is
      # already published from different bytes (immutability - only a CX version bump resolves it).
      # `should_build=false` is a deliberate, successful no-op: no source release, or an identical
      # release already published.
      - name: Resolve release inputs
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_CODEX_VERSION: ${{ inputs.codex_version || 'auto' }}
          REQUESTED_PLATFORMS: ${{ inputs.self_hosted && 'arm64' || inputs.platforms || 'arm64,x64' }}
          SELF_HOSTED: ${{ inputs.self_hosted && 'true' || 'false' }}
        run: |
          set -o pipefail
          bun scripts/prebuilt.ts detect \
            --codex-version "$REQUESTED_CODEX_VERSION" \
            --event "$GITHUB_EVENT_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --platforms "$REQUESTED_PLATFORMS" \
            --self-hosted "$SELF_HOSTED" 2>&1 | tee -a "$RUNNER_TEMP/prebuilt-detect.log"
      # The evidence `report` excerpts from. `if: always()` so a failed step's log still ships,
      # and one artifact name per job because v4 artifacts are immutable.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: logs-detect-${{ github.run_id }}
          path: ${{ runner.temp }}/prebuilt-detect.log
          if-no-files-found: warn
          retention-days: 7

  validate:
    needs: detect
    if: needs.detect.outputs.should_build == 'true'
    runs-on: ${{ inputs.self_hosted && fromJSON('["self-hosted","macOS","ARM64","m5-pro"]') || 'macos-15' }}
    timeout-minutes: 20
    steps:
      # The frozen source commit, not the branch head: a scheduled run builds its source release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.detect.outputs.source_commit }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      # Every failing-capable step tees into one per-job log (`set -o pipefail` so the step's own
      # exit code is the command's, not tee's). `report` excerpts its tail into the issue.
      - run: set -o pipefail; bun install --frozen-lockfile 2>&1 | tee -a "$RUNNER_TEMP/prebuilt-validate.log"
      - run: set -o pipefail; bun run typecheck 2>&1 | tee -a "$RUNNER_TEMP/prebuilt-validate.log"
      - run: set -o pipefail; bun test 2>&1 | tee -a "$RUNNER_TEMP/prebuilt-validate.log"
      # CXSTATUSLINE_RELEASE_BUILD=1 refuses a dirty or commit-less checkout.
      - run: set -o pipefail; CXSTATUSLINE_RELEASE_BUILD=1 bun run build 2>&1 | tee -a "$RUNNER_TEMP/prebuilt-validate.log"
      - name: Bundle reports the detected cxstatusline version
        env:
          EXPECTED_CX: ${{ needs.detect.outputs.cx_version }}
        run: |
          set -o pipefail
          {
            actual="$(node dist/cxstatusline.js --version)"
            echo "$actual"
            test "$actual" = "cxstatusline $EXPECTED_CX"
          } 2>&1 | tee -a "$RUNNER_TEMP/prebuilt-validate.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: logs-validate-${{ github.run_id }}
          path: ${{ runner.temp }}/prebuilt-validate.log
          if-no-files-found: warn
          retention-days: 7

  native:
    needs: [detect, validate]
    if: needs.detect.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      CODEX_VERSION: ${{ needs.detect.outputs.codex_version }}
      CX_VERSION: ${{ needs.detect.outputs.cx_version }}
      SOURCE_COMMIT: ${{ needs.detect.outputs.source_commit }}
      EXPECTED_ARCH: ${{ matrix.arch }}
      V8_TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.detect.outputs.source_commit }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - run: set -o pipefail; bun install --frozen-lockfile 2>&1 | tee -a "$RUNNER_TEMP/prebuilt-native.log"
      - name: Check native runner
        run: |
          set -o pipefail
          {
            uname -m
            sw_vers
            bun -e 'if (process.platform !== "darwin" || process.arch !== process.env.EXPECTED_ARCH) throw new Error("wrong native runner")'
            df -h .
          } 2>&1 | tee -a "$RUNNER_TEMP/prebuilt-native.log"
      # Clones the exact upstream tag and applies the exact patch; `--check` first, never a fixup.
      - name: Fetch exact upstream and apply patch
        id: build
        run: |
          set -o pipefail
          bun scripts/prebuilt.ts build --codex-version "$CODEX_VERSION" \
            --upstream "$GITHUB_WORKSPACE/upstream" 2>&1 | tee -a "$RUNNER_TEMP/prebuilt-native.log"
      # Cache the Cargo build output and registry across runs. Keyed on everything that would
      # invalidate it: OS/arch, the exact upstream tag, the toolchain upstream pins, the resolved
      # dependency graph and the applied patch. The upstream checkout itself is still reset and
      # re-cloned every run (see `resetDirectory` in scripts/prebuilt.ts) - only compiled artifacts
      # and downloaded crates are reused.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            upstream/codex-rs/target
            ~/.cargo/registry
            ~/.cargo/git
          key: >-
            ${{ runner.os }}-${{ runner.arch }}-${{ steps.build.outputs.upstream_tag }}-
            ${{ hashFiles('upstream/**/rust-toolchain.toml') }}-
            ${{ hashFiles('upstream/codex-rs/Cargo.lock') }}-
            ${{ steps.build.outputs.patch_sha256 }}
      - name: Prepare verified Codex V8 archive and bindings
        run: |
          set -o pipefail
          bash scripts/setup-ci-v8.sh "$GITHUB_WORKSPACE/upstream" "$V8_TARGET" 2>&1 | tee -a "$RUNNER_TEMP/prebuilt-native.log"
      - name: Prepare Rust test tools
        run: |
          set -o pipefail
          {
            if ! command -v just >/dev/null || ! command -v cargo-nextest >/dev/null || ! command -v cargo-about >/dev/null || ! command -v cargo-deny >/dev/null; then
              brew install just cargo-nextest cargo-about cargo-deny
            fi
            cd upstream/codex-rs
            rustup show active-toolchain
          } 2>&1 | tee -a "$RUNNER_TEMP/prebuilt-native.log"
      - name: Focused patched Rust tests
        working-directory: upstream
        run: |
          set -o pipefail
          just test --release -p codex-tui cxstatusline --retries 0 2>&1 | tee -a "$RUNNER_TEMP/prebuilt-native.log"
      - name: Build synchronized executable pair
        working-directory: upstream/codex-rs
        run: |
          set -o pipefail
          cargo build --release -p codex-cli --bin codex \
            -p codex-code-mode-host --bin codex-code-mode-host 2>&1 | tee -a "$RUNNER_TEMP/prebuilt-native.log"
      - name: Audit Rust dependency licenses and generate notices
        run: |
          set -o pipefail
          bun scripts/prebuilt.ts rust-notices --upstream "$GITHUB_WORKSPACE/upstream" \
            --out "$RUNNER_TEMP/rust-notices.md" 2>&1 | tee -a "$RUNNER_TEMP/prebuilt-native.log"
      # `out/` ends up holding exactly the three release assets; nothing else may be added to it.
      - name: Package release assets
        run: |
          set -o pipefail
          bun scripts/prebuilt.ts package \
            --codex-version "$CODEX_VERSION" \
            --cx-version "$CX_VERSION" \
            --source-commit "$SOURCE_COMMIT" \
            --upstream "$GITHUB_WORKSPACE/upstream" \
            --staging "$RUNNER_TEMP/staging" \
            --rust-notices "$RUNNER_TEMP/rust-notices.md" \
            --platform "$PLATFORM" \
            --out "$GITHUB_WORKSPACE/out" 2>&1 | tee -a "$RUNNER_TEMP/prebuilt-native.log"
      - name: Verify release assets
        run: |
          set -o pipefail
          bun scripts/prebuilt.ts verify --out "$GITHUB_WORKSPACE/out" \
            --codex-version "$CODEX_VERSION" --cx-version "$CX_VERSION" \
            --platform "$PLATFORM" 2>&1 | tee -a "$RUNNER_TEMP/prebuilt-native.log"
      - name: Record build provenance
        env:
          UPSTREAM_COMMIT: ${{ steps.build.outputs.upstream_commit }}
        run: |
          mkdir -p provenance
          cp "$RUNNER_TEMP/rust-notices.md" provenance/
          # The patch was applied with `git apply --index`, so its Cargo.lock change is staged:
          # an unstaged diff would be empty and record no provenance at all. The unstaged diff is
          # kept as a second file because cargo can rewrite the lockfile during the build.
          git -C upstream diff --cached -- codex-rs/Cargo.lock > provenance/Cargo.lock.patched.diff
          git -C upstream diff -- codex-rs/Cargo.lock > provenance/Cargo.lock.build.diff
          shasum -a 256 upstream/codex-rs/Cargo.lock > provenance/Cargo.lock.sha256
          {
            echo "upstream_commit=$UPSTREAM_COMMIT"
            echo "source_commit=$SOURCE_COMMIT"
            uname -m
            sw_vers
            rustc --version
          } > provenance/environment.txt
          for bin in codex codex-code-mode-host; do
            vtool -show-build "upstream/codex-rs/target/release/$bin" >> provenance/macho.txt
            otool -L "upstream/codex-rs/target/release/$bin" >> provenance/macho.txt
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: logs-native-${{ matrix.platform }}-${{ github.run_id }}
          path: ${{ runner.temp }}/prebuilt-native.log
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ needs.detect.outputs.tag }}-${{ matrix.platform }}
          path: out/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provenance-${{ needs.detect.outputs.tag }}-${{ matrix.platform }}
          path: provenance/
          if-no-files-found: error
          retention-days: 7

  merge:
    needs: [detect, native]
    if: needs.detect.outputs.should_build == 'true'
    runs-on: ${{ inputs.self_hosted && fromJSON('["self-hosted","macOS","ARM64","m5-pro"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.detect.outputs.source_commit }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - run: set -o pipefail; bun install --frozen-lockfile 2>&1 | tee -a "$RUNNER_TEMP/prebuilt-merge.log"
      - name: Download platform release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-${{ needs.detect.outputs.tag }}-*
          merge-multiple: false
          path: parts
      - name: Merge release manifests and archives
        env:
          PLATFORMS: ${{ needs.detect.outputs.platforms }}
        run: |
          set -o pipefail
          bun scripts/prebuilt.ts merge \
            --inputs "$GITHUB_WORKSPACE/parts" \
            --out "$GITHUB_WORKSPACE/out" \
            --platforms "$PLATFORMS" 2>&1 | tee -a "$RUNNER_TEMP/prebuilt-merge.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: logs-merge-${{ github.run_id }}
          path: ${{ runner.temp }}/prebuilt-merge.log
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ needs.detect.outputs.tag }}
          path: out/
          if-no-files-found: error
          retention-days: 7

  # The only job with release-write credentials, and the only one that talks to the Releases API
  # in a writing way. It re-checks the release state immediately before uploading (a build takes
  # 1-3 hours, so `detect`'s answer can be stale), resumes an existing draft by uploading only the
  # missing assets, downloads all three back and re-verifies them against the manifest and
  # SHA256SUMS, and only then flips the draft to published. No --clobber, no delete, no visibility
  # change, ever. Exit 3 means blocked: the owner has to act and `report` files one issue.
  publish:
    needs: [detect, merge]
    if: >-
      github.repository == 'adrijshikhar/cxstatusline' && needs.detect.outputs.should_build == 'true'
      && (github.event_name == 'schedule' || inputs.publish == true)
    runs-on: ${{ inputs.self_hosted && fromJSON('["self-hosted","macOS","ARM64","m5-pro"]') || 'macos-15' }}
    timeout-minutes: 60
    permissions:
      contents: write
    concurrency:
      group: prebuilt-publish-${{ needs.detect.outputs.tag }}
      cancel-in-progress: false
    outputs:
      release_url: ${{ steps.publish.outputs.release_url }}
      published: ${{ steps.publish.outputs.published }}
    steps:
      # `gh` is the only way this job talks to GitHub, and a self-hosted runner is not guaranteed
      # to have it. Fail here with a named cause rather than inside the script.
      - name: Require gh on this runner
        run: command -v gh >/dev/null || { echo "::error::gh CLI is required on this runner"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ needs.detect.outputs.source_commit }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      # Teed like every other failing-capable step, so `report` has an excerpt when dependency
      # installation is what broke.
      - run: set -o pipefail; bun install --frozen-lockfile 2>&1 | tee -a "$RUNNER_TEMP/prebuilt-publish.log"
      # The exact bytes `merge` unified: nothing is rebuilt and no timestamp is regenerated.
      - id: fetch-assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ needs.detect.outputs.tag }}
          path: release-assets
      # The documented expired-artifact case: without this line the publish log would be empty and
      # `report` would say "no error excerpt captured" for a failure with a known, nameable cause.
      - name: Record a missing release artifact
        if: failure() && steps.fetch-assets.outcome == 'failure'
        env:
          ARTIFACT: release-${{ needs.detect.outputs.tag }}
        run: |
          echo "workflow artifact $ARTIFACT could not be downloaded (missing, expired or never uploaded);" \
            "re-run the build to regenerate it" | tee -a "$RUNNER_TEMP/prebuilt-publish.log"
      - name: Publish release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.detect.outputs.tag }}
          CODEX_VERSION: ${{ needs.detect.outputs.codex_version }}
          CX_VERSION: ${{ needs.detect.outputs.cx_version }}
          PLATFORMS: ${{ needs.detect.outputs.platforms }}
          SOURCE_COMMIT: ${{ needs.detect.outputs.source_commit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -o pipefail
          bun scripts/prebuilt.ts publish \
            --tag "$TAG" \
            --dir "$GITHUB_WORKSPACE/release-assets" \
            --run-id "$GITHUB_RUN_ID" \
            --run-url "$RUN_URL" \
            --source-commit "$SOURCE_COMMIT" \
            --codex-version "$CODEX_VERSION" \
            --cx-version "$CX_VERSION" \
            --platforms "$PLATFORMS" \
            --event "$GITHUB_EVENT_NAME" 2>&1 | tee -a "$RUNNER_TEMP/prebuilt-publish.log"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: logs-publish-${{ github.run_id }}
          path: ${{ runner.temp }}/prebuilt-publish.log
          if-no-files-found: warn
          retention-days: 7

  # Always runs, so no failure is silent. Upserts exactly one open issue per release identity by
  # title *and* body marker, closes the issue that a success actually clears, and fails the job if
  # the GitHub API call it needed did not succeed - it never claims issue state it did not observe.
  report:
    needs: [detect, validate, native, merge, publish]
    if: always() && github.repository == 'adrijshikhar/cxstatusline'
    runs-on: ${{ inputs.self_hosted && fromJSON('["self-hosted","macOS","ARM64","m5-pro"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      # `gh` is the only way this job talks to GitHub, and a self-hosted runner is not guaranteed
      # to have it. Fail here with a named cause rather than inside the script.
      - name: Require gh on this runner
        run: command -v gh >/dev/null || { echo "::error::gh CLI is required on this runner"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      # The failure evidence. `continue-on-error` because a missing or expired log must not stop
      # the report: the issue then says "no error excerpt captured" instead of quietly omitting it.
      - name: Download stage logs
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: logs-*-${{ github.run_id }}
          merge-multiple: true
          path: stage-logs
      - name: Report run outcome
        env:
          GH_TOKEN: ${{ github.token }}
          DETECT_RESULT: ${{ needs.detect.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          MERGE_RESULT: ${{ needs.merge.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          CODEX_VERSION: ${{ needs.detect.outputs.codex_version }}
          CX_VERSION: ${{ needs.detect.outputs.cx_version }}
          TAG: ${{ needs.detect.outputs.tag }}
          UPSTREAM_TAG: ${{ needs.detect.outputs.upstream_tag }}
          PATCH_SHA256: ${{ needs.detect.outputs.patch_sha256 }}
          SOURCE_COMMIT: ${{ needs.detect.outputs.source_commit }}
          SHOULD_BUILD: ${{ needs.detect.outputs.should_build }}
          PUBLISH_REQUESTED: ${{ github.event_name == 'schedule' || inputs.publish == true }}
          RELEASE_URL: ${{ needs.publish.outputs.release_url }}
          BLOCKED_REASON: ${{ needs.detect.outputs.blocked_reason }}
          PLATFORMS: ${{ needs.detect.outputs.platforms }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bun scripts/prebuilt.ts report \
            --detect "$DETECT_RESULT" \
            --validate "$VALIDATE_RESULT" \
            --native "$NATIVE_RESULT" \
            --merge "$MERGE_RESULT" \
            --publish "$PUBLISH_RESULT" \
            --codex-version "$CODEX_VERSION" \
            --cx-version "$CX_VERSION" \
            --tag "$TAG" \
            --upstream-tag "$UPSTREAM_TAG" \
            --patch-sha256 "$PATCH_SHA256" \
            --source-commit "$SOURCE_COMMIT" \
            --should-build "$SHOULD_BUILD" \
            --publish-requested "$PUBLISH_REQUESTED" \
            --release-url "$RELEASE_URL" \
            --run-url "$RUN_URL" \
            --repo "$GITHUB_REPOSITORY" \
            --event "$GITHUB_EVENT_NAME" \
            --blocked-reason "$BLOCKED_REASON" \
            --platforms "$PLATFORMS" \
            --log-dir "$GITHUB_WORKSPACE/stage-logs"
