name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test ./test ./src
      - run: bun run build
      - run: bun run check:package
      - run: cd website && bun install --frozen-lockfile
      - run: cd website && bunx tsc --noEmit
      - run: cd website && bun run build
      - run: cd website && bun run test
      - run: cd website && bunx playwright install chromium
      - run: bun run test:website:e2e

