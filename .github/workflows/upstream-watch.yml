name: Upstream Watcher

on:
  schedule:
    # Check upstream daily at 04:00 UTC
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Target upstream Codex version to check (default: auto)"
        type: string
        required: false
        default: "auto"
      dry_run:
        description: "Dry run (test patch without opening PR or issue)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Check Codex Upstream Releases
    runs-on: ubuntu-latest
    if: github.repository == 'adrijshikhar/cxstatusline'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Upstream Watcher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=()
          if [ -n "$INPUT_VERSION" ] && [ "$INPUT_VERSION" != "auto" ]; then
            ARGS+=(--version "$INPUT_VERSION")
          fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          bun run scripts/upstream-watch.ts "${ARGS[@]}"

  coverage:
    name: Audit complete Codex release coverage
    runs-on: ubuntu-latest
    if: github.repository == 'adrijshikhar/cxstatusline'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - name: Audit all stable Codex releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/upstream-coverage.ts --repo "$GITHUB_REPOSITORY" --json coverage-report.json
      - name: Upload coverage report
        if: always() && hashFiles('coverage-report.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-release-coverage
          path: coverage-report.json
          if-no-files-found: error
          retention-days: 30
