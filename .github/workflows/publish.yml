name: Publish npm
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'adrijshikhar/cxstatusline'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun test
      - run: CXSTATUSLINE_RELEASE_BUILD=1 bun run build
      - run: bun run check:package
      - env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release-npm.ts check --tag "$TAG" --sha "$SHA"
      - run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
      - run: cd "$RUNNER_TEMP" && shasum -a 256 cxstatusline-*.tgz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-${{ github.ref_name }}
          path: |
            ${{ runner.temp }}/cxstatusline-*.tgz
            ${{ runner.temp }}/SHA256SUMS
          if-no-files-found: error
  publish:
    needs: verify
    if: github.repository == 'adrijshikhar/cxstatusline'
    runs-on: ubuntu-latest
    environment: npm            # owner-configured with a required reviewer
    permissions:
      contents: write           # creates the v<CX> source release
      id-token: write           # npm trusted publishing (OIDC)
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-${{ github.ref_name }}
          path: dist-npm
      - run: cd dist-npm && shasum -a 256 -c SHA256SUMS
      - env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || gh release create "$TAG" --repo "$REPO" --title "cxstatusline $TAG" --notes "Source release; the packed CLI and its checksum are attached. Native Codex pairs are separate releases tagged cxstatusline-$TAG-codex-v<CODEX>." --verify-tag
          gh release upload "$TAG" --repo "$REPO" dist-npm/cxstatusline-*.tgz dist-npm/SHA256SUMS
      - run: npm publish dist-npm/cxstatusline-*.tgz --provenance --access public
